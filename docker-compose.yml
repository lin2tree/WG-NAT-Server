# Docker Compose for development environment
version: '3.8'

services:
  postgres:
    image: postgres:15
    environment:
      POSTGRES_DB: vpn_manager
      POSTGRES_USER: vpn_admin
      POSTGRES_PASSWORD: ${DB_PASSWORD:-vpn_secret}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vpn_admin -d vpn_manager"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      DATABASE_URL: postgresql://vpn_admin:${DB_PASSWORD:-vpn_secret}@postgres:5432/vpn_manager
      VM_TOKEN: ${VM_TOKEN:-vm_default_token}
      ADMIN_JWT_SECRET: ${ADMIN_JWT_SECRET:-admin_jwt_secret}
      ADMIN_JWT_EXPIRE_HOURS: 24
      LOG_LEVEL: INFO
      LOG_RETENTION_DAYS: 90
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  postgres_data:
