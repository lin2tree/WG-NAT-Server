# Docker Compose for development environment
version: '3.8'

services:
  postgres:
    image: postgres:15
    environment:
      POSTGRES_DB: vpn_manager
      POSTGRES_USER: vpn_admin
      POSTGRES_PASSWORD: ${DB_PASSWORD:-vpn_secret}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vpn_admin -d vpn_manager"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - fcloud_internal

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      DATABASE_URL: postgresql://vpn_admin:${DB_PASSWORD:-vpn_secret}@postgres:5432/vpn_manager
      DEFAULT_ADMIN_USERNAME: ${DEFAULT_ADMIN_USERNAME:-admin}
      DEFAULT_ADMIN_PASSWORD: ${DEFAULT_ADMIN_PASSWORD:-admin123}
      VM_TOKEN: ${VM_TOKEN:-vm_default_token}
      THIRD_PARTY_TOKEN: ${THIRD_PARTY_TOKEN:-3rd_default_token}
      ADMIN_JWT_SECRET: ${ADMIN_JWT_SECRET:-admin_jwt_secret}
      ADMIN_JWT_EXPIRE_HOURS: ${ADMIN_JWT_EXPIRE_HOURS:-24}
      PUBLIC_IP: ${PUBLIC_IP:-127.0.0.1}
      TRUSTED_PROXIES: ${TRUSTED_PROXIES:-}
      WIREGUARD_VPN_SUBNET: ${WIREGUARD_VPN_SUBNET:-10}
      WIREGUARD_SERVER_PORT: ${WIREGUARD_SERVER_PORT:-2588}
      WIREGUARD_CLIENT_COUNT: ${WIREGUARD_CLIENT_COUNT:-6}
      WIREGUARD_KEEPALIVE: ${WIREGUARD_KEEPALIVE:-25}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      LOG_RETENTION_DAYS: ${LOG_RETENTION_DAYS:-90}
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - fcloud_internal
      - fcloud_external

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - VITE_API_BASE_URL=http://${SERVER_IP:-localhost}:${BACKEND_PORT:-8000}
        - VITE_REFRESH_INTERVAL=${VITE_REFRESH_INTERVAL:-5000}
    ports:
      - "${FRONTEND_PORT:-80}:80"
    depends_on:
      - backend
    networks:
      - fcloud_external

networks:
  fcloud_internal:
    internal: true
  fcloud_external:

volumes:
  postgres_data:
